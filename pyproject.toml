[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planner"
version = "0.1.0"
description = "South India intelligent travel planner (agentic RAG, IR project)"
# D9: baseline is 3.10 because that is what is installed; code must stay 3.10-safe.
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".cache", "data", "index"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
